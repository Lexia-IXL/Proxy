<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Proxy Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0b0c10; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
        #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .container { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; padding: 20px; text-align: center; }
        h1 { font-size: 3rem; margin-bottom: 10px; color: #66fcf1; text-shadow: 0 0 10px rgba(102, 252, 241, 0.3); }
        p { font-size: 1.1rem; color: #c5c6c7; margin-bottom: 30px; }
        .search-box { width: 100%; max-width: 600px; display: flex; background: rgba(31, 40, 51, 0.8); border: 2px solid #45f3ff; border-radius: 30px; padding: 5px 15px; box-shadow: 0 0 15px rgba(69, 243, 255, 0.2); transition: 0.3s; }
        .search-box:focus-within { box-shadow: 0 0 25px rgba(69, 243, 255, 0.4); }
        .search-box input { flex: 1; background: none; border: none; outline: none; padding: 12px 10px; font-size: 1.1rem; color: #fff; }
        .search-box button { background: #66fcf1; border: none; outline: none; color: #0b0c10; padding: 0 25px; font-weight: bold; border-radius: 20px; cursor: pointer; transition: 0.2s; }
        .search-box button:hover { background: #45f3ff; transform: scale(1.05); }
        .quick-links { display: flex; gap: 15px; margin-top: 35px; flex-wrap: wrap; justify-content: center; }
        .link-card { background: rgba(31, 40, 51, 0.6); border: 1px solid #1f2833; padding: 15px 25px; border-radius: 12px; cursor: pointer; min-width: 120px; transition: 0.3s; font-weight: 500; text-transform: capitalize; }
        .link-card:hover { border-color: #66fcf1; background: rgba(102, 252, 241, 0.1); transform: translateY(-3px); }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <h1>Proxy Portal</h1>
        <p>Enter any URL address below to browse dynamically through your network node.</p>
        
        <form class="search-box" id="proxy-form">
            <input type="text" id="target-input" placeholder="Enter target URL (e.g., https://example.com)..." required autocomplete="off">
            <button type="submit">Launch</button>
        </form>

        <div class="quick-links">
            <div class="link-card" onclick="quickLaunch('https://www.google.com')">Google</div>
            <div class="link-card" onclick="quickLaunch('https://wikipedia.org')">Wikipedia</div>
            <div class="link-card" onclick="quickLaunch('https://www.reddit.com')">Reddit</div>
            <div class="link-card" onclick="quickLaunch('https://ycombinator.com')">HackerNews</div>
        </div>
    </div>

    <script>
        // Form search submission handler logic
        document.getElementById('proxy-form').addEventListener('submit', function(e) {
            e.preventDefault();
            let inputUrl = document.getElementById('target-input').value.trim();
            if(inputUrl) executeRoute(inputUrl);
        });

        function quickLaunch(url) {
            executeRoute(url);
        }

        function executeRoute(url) {
            // Strip structural protocols to prevent parsing mismatches before routing execution
            let formattedUrl = url;
            if (!/^https?:\/\//i.test(formattedUrl)) {
                formattedUrl = 'https://' + formattedUrl;
            }
            // Construct the path endpoint match
            window.location.href = window.location.origin + '/service/' + encodeURIComponent(formattedUrl);
        }

        // Particle background generation engine logic
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.6 - 0.3;
                this.speedY = Math.random() * 0.6 - 0.3;
                this.alpha = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = `rgba(102, 252, 241, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.floor((canvas.width * canvas.height) / 9000);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }
        initParticles();

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
