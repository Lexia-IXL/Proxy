<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Hub: Search, Games & Proxy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background-color: #06070d; color: #fff; overflow-x: hidden; }
        
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        .navbar { position: relative; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: rgba(10, 12, 22, 0.85); border-bottom: 1px solid #1f2335; backdrop-filter: blur(10px); }
        .logo { font-size: 1.6rem; font-weight: 800; color: #45f3ff; text-shadow: 0 0 10px rgba(69,243,255,0.3); }
        .nav-tabs { display: flex; gap: 10px; }
        .tab-btn { background: none; border: 1px solid transparent; color: #a9b1d6; padding: 8px 20px; font-size: 1rem; border-radius: 6px; cursor: pointer; transition: 0.3s; font-weight: 500; }
        .tab-btn:hover { color: #45f3ff; background: rgba(69, 243, 255, 0.05); }
        .tab-btn.active { color: #06070d; background: #45f3ff; border-color: #45f3ff; box-shadow: 0 0 15px rgba(69,243,255,0.4); }

        .main-content { position: relative; z-index: 5; max-width: 1200px; margin: 60px auto; padding: 0 20px; width: 100%; }
        .panel { display: none; width: 100%; animation: fadeIn 0.4s ease forwards; }
        .panel.active { display: block; }

        /* SEARCH ENGINE CSS */
        .search-container { text-align: center; max-width: 700px; margin: 40px auto; }
        .search-container h2 { font-size: 2.5rem; margin-bottom: 25px; color: #fff; font-weight: 700; }
        .search-container h2 span { color: #45f3ff; }
        .search-type-selector { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .type-label { background: #1a1b26; border: 1px solid #292e42; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .type-label input { display: none; }
        .type-label:has(input:checked) { border-color: #45f3ff; background: rgba(69, 243, 255, 0.1); color: #45f3ff; }
        
        .search-bar-wrap { display: flex; background: rgba(26, 27, 38, 0.9); border: 2px solid #292e42; border-radius: 50px; padding: 6px 10px; width: 100%; transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .search-bar-wrap:focus-within { border-color: #45f3ff; box-shadow: 0 0 20px rgba(69, 243, 255, 0.2); }
        .search-bar-wrap input { flex: 1; background: none; border: none; outline: none; padding: 10px 15px; font-size: 1.1rem; color: #fff; }
        .search-bar-wrap button { background: #45f3ff; border: none; outline: none; color: #06070d; padding: 0 30px; font-weight: bold; border-radius: 40px; cursor: pointer; transition: 0.2s; }
        .search-bar-wrap button:hover { background: #3ad2db; transform: scale(1.02); }

        /* GAMES ARCHITECT GRID */
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; margin-top: 20px; }
        .game-card { background: rgba(26, 27, 38, 0.85); border: 1px solid #292e42; border-radius: 12px; padding: 20px; transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; min-height: 200px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); backdrop-filter: blur(5px); }
        .game-card:hover { border-color: #ff007f; transform: translateY(-5px); box-shadow: 0 10px 25px rgba(255, 0, 127, 0.2); }
        .game-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; color: #ff007f; }
        .game-desc { font-size: 0.95rem; color: #a9b1d6; line-height: 1.4; margin-bottom: 20px; }
        .game-btn { background: none; border: 1px solid #ff007f; color: #ff007f; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; text-align: center; text-decoration: none; }
        .game-btn:hover { background: #ff007f; color: #fff; box-shadow: 0 0 15px rgba(255,0,127,0.4); }

        .game-viewport-wrap { display: none; width: 100%; height: 75vh; background: #000; border: 2px solid #ff007f; border-radius: 12px; overflow: hidden; margin-top: 20px; position: relative; }
        .game-viewport-wrap iframe { width: 100%; height: 100%; border: none; }
        .close-game-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,0,127,0.9); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; z-index: 20; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <nav class="navbar">
        <div class="logo">NEXUS.HUB</div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('search')">Search Engine</button>
            <button class="tab-btn" onclick="switchTab('games')">Arcade Games</button>
        </div>
    </nav>

    <main class="main-content">
        <!-- TAB 1: SEARCH ENGINE PANEL -->
        <div id="search-panel" class="panel active">
            <div class="search-container">
                <h2>Nexus <span>Search</span></h2>
                <div class="search-type-selector">
                    <label class="type-label"><input type="radio" name="stype" value="web" checked> Web Index</label>
                    <label class="type-label"><input type="radio" name="stype" value="video"> Streaming Video (YT Proxy)</label>
                </div>
                <form class="search-bar-wrap" action="/engine/search" method="GET" onsubmit="return handleSearchSubmit(this)">
                    <input type="text" name="q" id="search-query" placeholder="Search keywords or input explicit link target URL..." required autocomplete="off">
                    <input type="hidden" name="type" id="search-type-hidden" value="web">
                    <button type="submit">Execute</button>
                </form>
            </div>
        </div>

        <!-- TAB 2: ARCADE GAMES PANEL -->
        <div id="games-panel" class="panel">
            <div id="games-list-view">
                <div class="games-grid">
                    <div class="game-card">
                        <div>
                            <div class="game-title">Retro Snake</div>
                            <div class="game-desc">The classic pixel retro arcade game. Consume neon blocks, grow long, and beat the highscore system.</div>
                        </div>
                        <button class="game-btn" onclick="launchLocalGame('snake')">Play Now</button>
                    </div>
                    <div class="game-card">
                        <div>
                            <div class="game-title">Space Invaders</div>
                            <div class="game-desc">Retro space arcade shooter. Defend your base installations against descending waves of aliens.</div>
                        </div>
                        <button class="game-btn" onclick="launchLocalGame('space')">Play Now</button>
                    </div>
                </div>
            </div>

            <div id="game-display-container" class="game-viewport-wrap">
                <button class="close-game-btn" onclick="closeGameViewport()">Exit Game</button>
                <div id="game-embed-target" style="width:100%; height:100%;"></div>
            </div>
        </div>
    </main>

    <script>
        // Tab switching navigation logic
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`${tabId}-panel`).classList.add('active');
            if(tabId !== 'games') closeGameViewport();
        }

        // Search engine preprocessing injection
        function handleSearchSubmit(form) {
            const selectedType = document.querySelector('input[name="stype"]:checked').value;
            const queryValue = document.getElementById('search-query').value.trim();
            document.getElementById('search-type-hidden').value = selectedType;

            // Direct URL entry override check
            if (/^https?:\/\/[^\s$.?#].[^\s]*$/i.test(queryValue)) {
                form.action = `/service/${encodeURIComponent(queryValue)}`;
                form.removeAttribute('method'); // Drop standard query bindings
                return true;
            }
            return true;
        }

        // Local game loader scripts injection
        function launchLocalGame(gameKey) {
            document.getElementById('games-list-view').style.display = 'none';
            const target = document.getElementById('game-embed-target');
            const viewport = document.getElementById('game-display-container');
            viewport.style.display = 'block';

            if(gameKey === 'snake') {
                target.innerHTML = `<iframe src="https://github.io" style="width:100%; height:100%; border:none;"></iframe>`;
            } else if(gameKey === 'space') {
                target.innerHTML = `<iframe src="https://github.io" style="width:100%; height:100%; border:none;"></iframe>`;
            }
        }

        function closeGameViewport() {
            document.getElementById('game-display-container').style.display = 'none';
            document.getElementById('game-embed-target').innerHTML = '';
            document.getElementById('games-list-view').style.display = 'block';
        }
